name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.jdearwood --project-name kjv_bible .
          rm -f test/widget_test.dart
      - name: Add signing key (only if the secrets are set)
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n' "$KS_PASSWORD" "$KS_PASSWORD" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets; building unsigned test files only."
          fi
      - name: App name, icon, link permissions, signing
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - name: Analyze (report problems as annotations)
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "^ *(error|warning) " analyze.txt | head -60 | while IFS= read -r l; do echo "::error title=analyze::${l}"; done
          grep -qE "^ *error " analyze.txt && echo "::error::analyze found errors" || true
      - name: Build test APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} > build.txt 2>&1 || { cat build.txt; grep -E "error|Error|FAILURE|What went wrong" -A3 build.txt | head -40 | while IFS= read -r l; do echo "::error title=build::${l}"; done; exit 1; }
          tail -5 build.txt
      - name: Build signed Play Store bundle
        if: env.SIGNED == 'true'
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} > bundle.txt 2>&1 || { cat bundle.txt; grep -E "error|Error|FAILURE|What went wrong" -A3 bundle.txt | head -40 | while IFS= read -r l; do echo "::error title=bundle::${l}"; done; exit 1; }
          tail -5 bundle.txt
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: kjv-bible-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: kjv-bible-aab
          path: build/app/outputs/bundle/release/app-release.aab
